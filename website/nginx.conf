map $http_origin $cors_origin {
    default "";
    "https://veritasvpn.cloud"    "$http_origin";
    "https://www.veritasvpn.cloud" "$http_origin";
    "http://localhost:8000"        "$http_origin";
    "http://127.0.0.1:8000"        "$http_origin";
}

server {
    listen 8000;
    server_name veritasvpn.cloud localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Tunnel terminates TLS and often connects to origin over HTTP.
    # Skip HTTPS redirect for Cloudflare (CF-Ray) or when proto is already https.
    set $needs_https 1;
    if ($http_x_forwarded_proto = "https") { set $needs_https 0; }
    if ($http_cf_ray != "") { set $needs_https 0; }
    if ($needs_https = 1) {
        return 301 https://$host$request_uri;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /api/v1/auth/ {
        proxy_pass http://auth-svc:8080/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/v1/billing/ {
        proxy_pass http://billing-svc:8080/api/v1/billing/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/v1/wg/ {
        proxy_pass http://wg-manager:8080/api/v1/wg/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/v1/agents/ {
        proxy_pass http://wg-manager:8080/api/v1/agents/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
