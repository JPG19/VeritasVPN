<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment received — VeritasVPN</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <meta http-equiv="refresh" content="2;url=/account/#/subscription">
</head>
<body>
  <main class="hero" style="min-height:100vh;display:flex;align-items:center;">
    <div class="container" style="text-align:center;max-width:560px;margin:0 auto;">
      <img src="../assets/logo-mark.png" alt="" width="64" height="64" style="margin-bottom:20px;">
      <h1 class="hero-title" style="font-size:40px;">You're Premium.</h1>
      <p class="hero-subtitle" style="margin-left:auto;margin-right:auto;">Bitcoin payment confirmed. Taking you to your dashboard…</p>
      <a class="btn btn-primary btn-lg" href="/account/#/subscription">Open dashboard</a>
    </div>
  </main>
  <script type="module">
    import { onAuthStateChanged, auth } from '../js/auth.js';
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.replace('/?signin=1');
    });
    setTimeout(() => {
      window.location.href = '/account/#/subscription';
    }, 1800);
  </script>
</body>
</html>
