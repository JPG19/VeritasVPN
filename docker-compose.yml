version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veritas
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/auth-svc/migrations:/docker-entrypoint-initdb.d/auth:ro
      - ./services/wg-manager/migrations:/docker-entrypoint-initdb.d/wg:ro
      - ./services/billing-svc/migrations:/docker-entrypoint-initdb.d/billing:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "veritas"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly no --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -js -m 8222

  auth-svc:
    build:
      context: .
      dockerfile: services/auth-svc/Dockerfile
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://veritas:veritas_dev@postgres:5432/veritas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: dev-secret-change-in-production-use-64-char-random-string
      LOG_LEVEL: debug
      LOG_FORMAT: console
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  wg-manager:
    build:
      context: .
      dockerfile: services/wg-manager/Dockerfile
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: postgres://veritas:veritas_dev@postgres:5432/veritas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      AGENT_AUTH_TOKEN: dev-agent-token
      LOG_LEVEL: debug
      LOG_FORMAT: console
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  billing-svc:
    build:
      context: .
      dockerfile: services/billing-svc/Dockerfile
    ports:
      - "8083:8080"
    environment:
      DATABASE_URL: postgres://veritas:veritas_dev@postgres:5432/veritas?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:-dev-agent-token}
      BTCPAY_SERVER_URL: ${BTCPAY_SERVER_URL:-http://host.docker.internal:49392}
      BTCPAY_API_KEY: ${BTCPAY_API_KEY:-}
      BTCPAY_STORE_ID: ${BTCPAY_STORE_ID:-}
      BTCPAY_WEBHOOK_SECRET: ${BTCPAY_WEBHOOK_SECRET:-}
      PREMIUM_PRICE_USD_CENTS: ${PREMIUM_PRICE_USD_CENTS:-500}
      PREMIUM_PERIOD_DAYS: ${PREMIUM_PERIOD_DAYS:-30}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-veritasvpn-37cf6}
      CHECKOUT_SUCCESS_URL: ${CHECKOUT_SUCCESS_URL:-http://localhost:8000/billing/success.html}
      CHECKOUT_CANCEL_URL: ${CHECKOUT_CANCEL_URL:-http://localhost:8000/billing/cancel.html}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      BILLING_PUBLIC_URL: ${BILLING_PUBLIC_URL:-http://localhost:8083}
      LOG_LEVEL: debug
      LOG_FORMAT: console
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - billing-svc
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./.cloudflared:/etc/cloudflared:ro
    network_mode: host
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  pgdata:
