name: Build VeritasVPN Desktop
#
# Required GitHub Secrets for macOS signing + notarization:
#   APPLE_CERTIFICATE          — Base64-encoded .p12 Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD — Password for the .p12 file
#   APPLE_SIGNING_IDENTITY     — "Developer ID Application: Your Name (TEAMID)"
#   APPLE_TEAM_ID              — 10-char Apple Team ID
#   APPLE_NOTARY_ISSUER        — App Store Connect API Issuer ID
#   APPLE_NOTARY_KEY           — Base64-encoded App Store Connect API key (.p8)
#   APPLE_NOTARY_KEY_ID        — 10-char App Store Connect API Key ID
#
# Without these, macOS builds will still produce an unsigned .dmg.
# Set them at: Settings → Secrets and variables → Actions → Repository secrets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Import Apple certificate (if configured)
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/apple_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning

      - name: Create notary key file (if configured)
        if: ${{ secrets.APPLE_NOTARY_KEY != '' }}
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_NOTARY_KEY" | base64 --decode -o ~/private_keys/AuthKey_${APPLE_NOTARY_KEY_ID}.p8

      - name: Install dependencies
        run: npm install
        working-directory: clients/desktop

      - name: Build .dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: npx tauri build
        working-directory: clients/desktop

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: veritasvpn-macos
          path: clients/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm install
        working-directory: clients/desktop

      - name: Build .deb and .AppImage
        run: npx tauri build
        working-directory: clients/desktop

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: veritasvpn-linux-deb
          path: clients/desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: veritasvpn-linux-appimage
          path: clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: [build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            veritasvpn-macos/*.dmg
            veritasvpn-linux-deb/*.deb
            veritasvpn-linux-appimage/*.AppImage
