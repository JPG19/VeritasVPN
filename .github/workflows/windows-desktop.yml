name: Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build

      - name: Rename assets to fixed names
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXE=$(ls clients/desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$EXE" VeritasVPN-Windows.exe
          MSI=$(ls clients/desktop/src-tauri/target/release/bundle/msi/*.msi | head -1)
          cp "$MSI" VeritasVPN-Windows.msi

      - uses: actions/upload-artifact@v4
        with:
          name: VeritasVPN-Windows
          path: |
            clients/desktop/src-tauri/target/release/bundle/msi/*.msi
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            VeritasVPN-Windows.exe
            VeritasVPN-Windows.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
