<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeritasVPN</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="shell">
    <header class="header">
      <img src="icons/icon48.png" alt="" width="32" height="32">
      <div>
        <strong>VeritasVPN</strong>
        <span class="tagline">Browser protection</span>
      </div>
    </header>

    <p id="statusBanner" class="banner" hidden></p>

    <section id="authView" class="view">
      <div class="tabs">
        <button type="button" class="tab is-active" data-mode="signin">Sign in</button>
        <button type="button" class="tab" data-mode="signup">Sign up</button>
      </div>
      <form id="authForm">
        <div id="emailFields">
          <label>
            Email
            <input type="email" id="email" autocomplete="username" placeholder="you@example.com">
          </label>
          <label>
            Password
            <input type="password" id="password" autocomplete="current-password" minlength="6" placeholder="••••••••">
          </label>
        </div>
        <div id="accountIdFields" hidden>
          <label>
            Account ID
            <input type="text" id="accountId" autocomplete="off" spellcheck="false" placeholder="Your account ID">
          </label>
        </div>
        <p id="anonHint" class="hint" hidden>Creates an anonymous account. You’ll get an Account ID to save — no email required.</p>
        <button type="submit" class="btn primary" id="authSubmit">Sign in</button>
      </form>
      <button type="button" class="linkish auth-alt" id="authMethodToggle">Sign in with Account ID instead</button>
      <p class="hint">Use the same account as <a href="https://veritasvpn.cloud" target="_blank" rel="noopener">veritasvpn.cloud</a>.</p>
    </section>

    <section id="mainView" class="view" hidden>
      <div class="user-row">
        <span id="userEmail"></span>
        <button type="button" class="linkish" id="signOutBtn">Sign out</button>
      </div>

      <div class="power">
        <button type="button" class="power-btn" id="toggleBtn" aria-pressed="false">
          <span id="toggleLabel">Connect</span>
        </button>
        <p id="connectionState" class="state">Disconnected</p>
      </div>

      <details class="settings">
        <summary>Proxy settings</summary>
        <label>
          Scheme
          <select id="proxyScheme">
            <option value="socks5">SOCKS5</option>
            <option value="http">HTTP</option>
            <option value="https">HTTPS</option>
          </select>
        </label>
        <label>
          Host
          <input type="text" id="proxyHost" placeholder="Leave empty for demo mode">
        </label>
        <label>
          Port
          <input type="number" id="proxyPort" value="1080" min="1" max="65535">
        </label>
        <button type="button" class="btn outline" id="saveProxyBtn">Save proxy</button>
        <p class="hint">Without a host, Connect is UI-only (safe for testing). Point at your Veritas SOCKS/HTTP proxy when ready.</p>
      </details>
    </section>
  </div>
  <script type="module" src="js/popup.js"></script>
</body>
</html>
